<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Motion Bed Control</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; background:#f3f4f6; color:#111827; min-height:100vh; }
    .wrap { max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:24px; }
    .card { background:#fff; border-radius:24px; padding:24px; box-shadow:0 10px 35px rgba(0,0,0,.08); }
    h1 { margin:0 0 8px; font-size:32px; }
    p { line-height:1.45; }
    .status { margin:18px 0; padding:13px 14px; background:#f9fafb; border-radius:14px; font-size:14px; }
    button { width:100%; padding:18px 16px; margin-top:14px; border:0; border-radius:18px; font-size:21px; font-weight:700; cursor:pointer; }
    #connect { background:#111827; color:white; }
    #zero { background:#2563eb; color:white; }
    #flat { background:#e5e7eb; color:#111827; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .small { font-size:12px; color:#6b7280; margin-top:18px; }
    code { word-break:break-all; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Motion Bed</h1>
      <p>Bluetooth control for Zero G and Flat.</p>

      <div id="status" class="status">Not connected</div>

      <button id="connect">Connect Bed</button>
      <button id="zero" disabled>Zero G</button>
      <button id="flat" disabled>Flat</button>

      <p class="small">
        Target: <code>S4-Y-192-46380:60</code><br>
        BLE: <code>FFE0 → FFE1</code>
      </p>
    </section>
  </main>

<script>
const SERVICE_UUID = 0xFFE0;
const CHARACTERISTIC_UUID = 0xFFE1;
const TARGET_NAME = "S4-Y-192-46380:60";
const ZERO_G_HEX = "FFFFFFFF05000000091706";
const FLAT_HEX   = "FFFFFFFF050000002A56DF";

let device = null;
let characteristic = null;

const statusEl = document.getElementById("status");
const connectBtn = document.getElementById("connect");
const zeroBtn = document.getElementById("zero");
const flatBtn = document.getElementById("flat");

function setStatus(text) {
  statusEl.textContent = text;
}

function hexToBytes(hex) {
  const clean = hex.replace(/\s+/g, "");
  const bytes = new Uint8Array(clean.length / 2);
  for (let i = 0; i < clean.length; i += 2) {
    bytes[i / 2] = parseInt(clean.slice(i, i + 2), 16);
  }
  return bytes;
}

async function connectBed() {
  try {
    if (!navigator.bluetooth) {
      throw new Error("Web Bluetooth is not available in this browser.");
    }

    setStatus("Choose the bed from the Bluetooth list…");

    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
      optionalServices: [SERVICE_UUID]
    });

    if (device.name && device.name !== TARGET_NAME) {
      setStatus(`Connected device is ${device.name}; expected ${TARGET_NAME}.`);
    }

    device.addEventListener("gattserverdisconnected", () => {
      characteristic = null;
      zeroBtn.disabled = true;
      flatBtn.disabled = true;
      setStatus("Disconnected");
    });

    setStatus(`Connecting to ${device.name || "bed"}…`);
    const server = await device.gatt.connect();

    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

    zeroBtn.disabled = false;
    flatBtn.disabled = false;
    setStatus(`Connected to ${device.name || "bed"}`);
  } catch (err) {
    console.error(err);
    setStatus(`Error: ${err.message}`);
  }
}

async function sendCommand(hex, label) {
  try {
    if (!characteristic) throw new Error("Connect to the bed first.");

    const data = hexToBytes(hex);
    setStatus(`Sending ${label}…`);

    if (typeof characteristic.writeValueWithoutResponse === "function") {
      await characteristic.writeValueWithoutResponse(data);
    } else {
      await characteristic.writeValue(data);
    }

    setStatus(`${label} sent`);
  } catch (err) {
    console.error(err);
    setStatus(`Error: ${err.message}`);
  }
}

connectBtn.addEventListener("click", connectBed);
zeroBtn.addEventListener("click", () => sendCommand(ZERO_G_HEX, "Zero G"));
flatBtn.addEventListener("click", () => sendCommand(FLAT_HEX, "Flat"));
</script>
</body>
</html>
